image: 192.168.40.153:9080/common/maven:3.8.1-openjdk-11-slim

stages:
  - build
  - clean
  - deploy

build:
  stage: build
  script:
    - echo 'exec mvn clean install'
    - echo 'tag:' $CI_COMMIT_TAG
    - echo "$MAVEN_SETTINGS_XML" > /usr/share/maven/conf/settings.xml
    - mvn clean install -Dmaven.test.skip=true
  only:
    - tags
    
clean:
  stage: clean
  script:
    - echo 'build job fail, exec mvn clean'
    - echo  'tag:' $CI_COMMIT_TAG
    - mvn clean
  when: on_failure
  only:
    - tags

deploy:
  stage: deploy
  script:
    - echo 'exec mvn package & docker build'
    - echo  'tag:' $CI_COMMIT_TAG
    - echo "$MAVEN_SETTINGS_XML" > /usr/share/maven/conf/settings.xml
    - mvn deploy -e
  when: on_success
  only:
    - tags
